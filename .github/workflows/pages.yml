# Builds the documentation site from wiki/*.md and docs/, and publishes it to GitHub Pages.
# The generated HTML is never committed: the .md files in wiki/ are the only source.
# Pages must be set to deploy from GitHub Actions, not from a branch's /docs folder.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "docs/**"
      - "tools/build/build_docs.py"
      - "requirements/requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/requirements-docs.txt

      - name: Install requirements
        run: python -m pip install -r requirements/requirements-docs.txt

      - name: Build the site
        run: python tools/build/build_docs.py --out _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
