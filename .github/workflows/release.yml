name: Build and release

# Publishing a release (GitHub's Releases page or `gh release create`) builds both
# installers, DigitalRain-Setup.exe and DigitalRain.dmg, and attaches them to it with
# SHA256SUMS.txt and build provenance attestations. Nothing else is attached.
# Starting it by hand builds them as artifacts only.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/requirements-build.txt
            requirements/requirements-dev.txt

      - name: Tag matches version_info.txt
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $text = Get-Content version_info.txt -Raw
          if ($text -notmatch "StringStruct\('ProductVersion', '([^']+)'\)") {
            throw "no ProductVersion in version_info.txt"
          }
          $version = $Matches[1]
          if ($tag -ne $version) {
            throw "tag $env:GITHUB_REF_NAME does not match version_info.txt ($version)"
          }

      - name: Install check requirements
        run: python -m pip install -r requirements/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Windowless checks
        env:
          SDL_VIDEODRIVER: dummy
        run: python tools/check.py --fast

      # Inno Setup is not guaranteed on the runner image, so install it if it is missing
      # (build.ps1 is given the path to ISCC.exe).
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $pf = ${env:ProgramFiles(x86)}
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "$pf\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          }
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "$pf\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after the install" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build DigitalRain-Setup.exe
        shell: pwsh
        run: ./build.ps1 -Python (Get-Command python).Source -NoSmoke -Iscc $env:ISCC

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DigitalRain-Setup.exe
          path: DigitalRain-Setup.exe
          if-no-files-found: error

  macos:
    # Apple Silicon runner: build_mac.sh checks the bundle has an arm64 slice.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # setup-python installs the python.org framework build on macOS, which py2app needs.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/requirements-mac.txt
            requirements/requirements-mac-build.txt

      - name: Build Digital Rain.saver and DigitalRain.dmg
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: bash tools/build/build_mac.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DigitalRain.dmg
          path: DigitalRain.dmg
          if-no-files-found: error

      - name: Keep the build log and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-build-results
          path: mac-build-results

  release:
    if: github.event_name == 'release'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: DigitalRain*
          merge-multiple: true

      - name: Checksums
        run: |
          ls -l DigitalRain-Setup.exe DigitalRain.dmg
          sha256sum DigitalRain-Setup.exe DigitalRain.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            DigitalRain-Setup.exe
            DigitalRain.dmg

      - name: Attach the installers and checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" DigitalRain-Setup.exe DigitalRain.dmg SHA256SUMS.txt --clobber

      - name: Release notes, when the release has none
        if: github.event.release.body == '' || github.event.release.body == null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          ID: ${{ github.event.release.id }}
        run: |
          notes=$(gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body)
          gh api -X PATCH "repos/$GH_REPO/releases/$ID" -f body="$notes" > /dev/null
